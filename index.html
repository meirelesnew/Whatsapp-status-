<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Divisor de Vídeo para WhatsApp (30s)</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- FFmpeg v0.12 Single-Threaded (compatível com navegadores móbile no GitHub Pages) -->
  <script src="https://unpkg.com/@ffmpeg/ffmpeg@0.12.10/dist/umd/ffmpeg.js"></script>
  <script src="https://unpkg.com/@ffmpeg/util@0.12.1/dist/umd/util.js"></script>
</head>
<body class="bg-gray-100 text-gray-800 min-h-screen flex flex-col items-center p-4">

  <div class="max-w-2xl w-full bg-white rounded-2xl shadow-lg p-6 my-8">
    <div class="text-center mb-6">
      <h1 class="text-2xl font-bold text-emerald-600">Divisor de Vídeo para WhatsApp</h1>
      <p class="text-gray-500 text-sm mt-1">Divida seu vídeo em partes de 30 segundos para o Status.</p>
    </div>

    <!-- Upload -->
    <div class="border-2 border-dashed border-emerald-400 rounded-xl p-8 text-center bg-emerald-50 hover:bg-emerald-100 transition cursor-pointer mb-6">
      <input type="file" id="videoInput" accept="video/*" class="hidden" />
      <label for="videoInput" class="cursor-pointer flex flex-col items-center">
        <span class="font-semibold text-emerald-800">Clique para selecionar um vídeo</span>
        <span class="text-xs text-gray-500 mt-1">Suporta arquivos MP4, MOV, WEBM e AVI</span>
      </label>
    </div>

    <!-- Progresso -->
    <div id="statusContainer" class="hidden mb-6">
      <div class="flex justify-between text-sm text-gray-600 mb-2 font-medium">
        <span id="statusText">Iniciando...</span>
        <span id="statusPercent">0%</span>
      </div>
      <div class="w-full bg-gray-200 rounded-full h-3 overflow-hidden">
        <div id="progressBar" class="bg-emerald-500 h-3 rounded-full transition-all duration-300" style="width: 0%"></div>
      </div>
    </div>

    <!-- Resultados -->
    <div id="resultsContainer" class="hidden">
      <h2 class="text-lg font-bold text-gray-700 mb-4 border-b pb-2">Partes Geradas:</h2>
      <div id="partsList" class="space-y-4"></div>
    </div>
  </div>

  <script>
    const { FFmpeg } = FFmpegWASM;
    const { fetchFile, toBlobURL } = FFmpegUtil;

    let ffmpeg = null;

    const videoInput = document.getElementById('videoInput');
    const statusContainer = document.getElementById('statusContainer');
    const statusText = document.getElementById('statusText');
    const statusPercent = document.getElementById('statusPercent');
    const progressBar = document.getElementById('progressBar');
    const resultsContainer = document.getElementById('resultsContainer');
    const partsList = document.getElementById('partsList');

    videoInput.addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if (!file) return;

      partsList.innerHTML = '';
      resultsContainer.classList.add('hidden');
      statusContainer.classList.remove('hidden');
      statusText.innerText = 'Carregando motor de vídeo...';
      progressBar.style.width = '10%';
      statusPercent.innerText = '10%';

      try {
        if (!ffmpeg) {
          ffmpeg = new FFmpeg();
          
          ffmpeg.on('progress', ({ progress }) => {
            const pct = Math.min(100, Math.max(0, Math.round(progress * 100)));
            progressBar.style.width = pct + '%';
            statusPercent.innerText = pct + '%';
          });

          // Carrega o núcleo single-thread
          const baseURL = 'https://unpkg.com/@ffmpeg/core@0.12.6/dist/umd';
          await ffmpeg.load({
            coreURL: await toBlobURL(`${baseURL}/ffmpeg-core.js`, 'text/javascript'),
            wasmURL: await toBlobURL(`${baseURL}/ffmpeg-core.wasm`, 'application/wasm')
          });
        }

        statusText.innerText = 'Lendo o arquivo...';
        progressBar.style.width = '30%';
        statusPercent.innerText = '30%';

        const ext = file.name.split('.').pop().toLowerCase() || 'mp4';
        const inputName = `input.${ext}`;

        await ffmpeg.writeFile(inputName, await fetchFile(file));

        statusText.innerText = 'Fatiando vídeo em partes de 30s...';

        await ffmpeg.exec([
          '-i', inputName,
          '-c', 'copy',
          '-map', '0',
          '-segment_time', '30',
          '-f', 'segment',
          '-reset_timestamps', '1',
          'parte_%03d.mp4'
        ]);

        statusText.innerText = 'Gerando arquivos para download...';

        const dirFiles = await ffmpeg.readDir('/');
        const partFiles = dirFiles
          .map(f => f.name)
          .filter(name => name.startsWith('parte_') && name.endsWith('.mp4'))
          .sort();

        resultsContainer.classList.remove('hidden');

        for (let i = 0; i < partFiles.length; i++) {
          const filename = partFiles[i];
          const data = await ffmpeg.readFile(filename);
          const blob = new Blob([data.buffer], { type: 'video/mp4' });
          const videoUrl = URL.createObjectURL(blob);

          const card = document.createElement('div');
          card.className = 'flex flex-col sm:flex-row items-center justify-between bg-gray-50 p-4 rounded-xl border border-gray-200 gap-4';

          const infoDiv = document.createElement('div');
          infoDiv.innerHTML = `<div class="font-semibold text-gray-800">Parte ${i + 1}</div>`;

          const videoPreview = document.createElement('video');
          videoPreview.src = videoUrl;
          videoPreview.controls = true;
          videoPreview.className = 'w-full sm:w-44 h-28 object-cover rounded-lg bg-black';

          const actionsDiv = document.createElement('div');
          actionsDiv.className = 'flex gap-2';

          const downloadBtn = document.createElement('a');
          downloadBtn.href = videoUrl;
          downloadBtn.download = `status_parte_${i + 1}.mp4`;
          downloadBtn.className = 'px-3 py-2 bg-gray-200 text-gray-700 text-sm rounded-lg font-medium';
          downloadBtn.innerText = 'Baixar';

          const shareBtn = document.createElement('button');
          shareBtn.className = 'px-3 py-2 bg-emerald-600 text-white text-sm rounded-lg font-medium';
          shareBtn.innerText = 'Compartilhar';
          shareBtn.onclick = async () => {
            const shareFile = new File([blob], `status_parte_${i + 1}.mp4`, { type: 'video/mp4' });
            if (navigator.canShare && navigator.canShare({ files: [shareFile] })) {
              await navigator.share({ files: [shareFile] });
            } else {
              alert('Compartilhamento direto não suportado no seu navegador. Use o botão Baixar.');
            }
          };

          actionsDiv.appendChild(downloadBtn);
          actionsDiv.appendChild(shareBtn);
          card.appendChild(infoDiv);
          card.appendChild(videoPreview);
          card.appendChild(actionsDiv);
          partsList.appendChild(card);
        }

        statusContainer.classList.add('hidden');

      } catch (err) {
        console.error(err);
        statusText.innerText = 'Erro ao processar o vídeo.';
      }
    });
  </script>
</body>
</html>

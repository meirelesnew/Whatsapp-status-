<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Divisor de Vídeo para WhatsApp & Stories</title>
  <meta name="description" content="Corte seus vídeos em partes de 15, 30 ou 60 segundos direto no seu navegador com total privacidade." />

  <!-- Meta Tags OpenGraph para pré-visualização no WhatsApp -->
  <meta property="og:title" content="Divisor de Vídeo para WhatsApp & Stories" />
  <meta property="og:description" content="Fatie seus vídeos em 30s sem enviar para nenhum servidor. Grátis e rápido!" />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://meirelesnew.github.io/Whatsapp-status-/" />

  <!-- Configuração PWA -->
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#10b981" />

  <!-- Tailwind CSS & FFmpeg v0.12 CDNs -->
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <script src="https://cdn.jsdelivr.net/npm/@ffmpeg/ffmpeg@0.12.10/dist/umd/ffmpeg.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@ffmpeg/util@0.12.1/dist/umd/util.js"></script>
</head>
<body class="bg-gray-100 text-gray-800 min-h-screen flex flex-col items-center p-4">

  <div class="max-w-2xl w-full bg-white rounded-2xl shadow-lg p-6 my-8">
    <div class="text-center mb-6">
      <h1 class="text-2xl font-bold text-emerald-600">Divisor de Vídeo para WhatsApp</h1>
      <p class="text-gray-500 text-sm mt-1">Divida seu vídeo em partes ideais para o Status ou Stories.</p>
    </div>

    <!-- Upload -->
    <div class="border-2 border-dashed border-emerald-400 rounded-xl p-8 text-center bg-emerald-50 hover:bg-emerald-100 transition cursor-pointer mb-6">
      <input type="file" id="videoInput" accept="video/*" class="hidden" />
      <label for="videoInput" class="cursor-pointer flex flex-col items-center">
        <span class="font-semibold text-emerald-800">Clique para selecionar um vídeo</span>
        <span class="text-xs text-gray-500 mt-1">Suporta MP4, MOV, WEBM e AVI</span>
      </label>
    </div>

    <!-- Progresso -->
    <div id="statusContainer" class="hidden mb-6">
      <div class="flex justify-between text-sm text-gray-600 mb-2 font-medium">
        <span id="statusText">Iniciando...</span>
        <span id="statusPercent">0%</span>
      </div>
      <div class="w-full bg-gray-200 rounded-full h-3 overflow-hidden mb-2">
        <div id="progressBar" class="bg-emerald-500 h-3 rounded-full transition-all duration-300" style="width: 0%"></div>
      </div>
      <div id="logText" class="text-xs text-gray-400 italic text-center"></div>
    </div>

    <!-- Resultados -->
    <div id="resultsContainer" class="hidden">
      <h2 class="text-lg font-bold text-gray-700 mb-4 border-b pb-2">Partes Geradas:</h2>
      <div id="partsList" class="space-y-4"></div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>

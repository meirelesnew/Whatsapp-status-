<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Divisor de Vídeo para WhatsApp (30s)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/@ffmpeg/ffmpeg@0.11.6/dist/ffmpeg.min.js"></script>
</head>
<body class="bg-gray-100 text-gray-800 min-h-screen flex flex-col items-center p-4">

  <div class="max-w-2xl w-full bg-white rounded-2xl shadow-lg p-6 my-8">
    <div class="text-center mb-6">
      <h1 class="text-2xl font-bold text-emerald-600 flex items-center justify-center gap-2">
        <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z"></path>
        </svg>
        Divisor de Vídeo para WhatsApp
      </h1>
      <p class="text-gray-500 text-sm mt-1">
        Divida seu vídeo em partes de 30 segundos ideais para o Status do WhatsApp.
      </p>
    </div>

    <div class="border-2 border-dashed border-emerald-400 rounded-xl p-8 text-center bg-emerald-50 hover:bg-emerald-100 transition cursor-pointer mb-6">
      <input type="file" id="videoInput" accept="video/*" class="hidden" />
      <label for="videoInput" class="cursor-pointer flex flex-col items-center">
        <svg class="w-12 h-12 text-emerald-500 mb-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"></path>
        </svg>
        <span class="font-semibold text-emerald-800">Clique para selecionar um vídeo</span>
        <span class="text-xs text-gray-500 mt-1">Suporta arquivos MP4, MOV, WEBM e AVI</span>
      </label>
    </div>

    <div id="statusContainer" class="hidden mb-6">
      <div class="flex justify-between text-sm text-gray-600 mb-2 font-medium">
        <span id="statusText">Iniciando...</span>
        <span id="statusPercent">0%</span>
      </div>
      <div class="w-full bg-gray-200 rounded-full h-3 overflow-hidden">
        <div id="progressBar" class="bg-emerald-500 h-3 rounded-full transition-all duration-300" style="width: 0%"></div>
      </div>
    </div>

    <div id="resultsContainer" class="hidden">
      <h2 class="text-lg font-bold text-gray-700 mb-4 border-b pb-2">Partes Geradas:</h2>
      <div id="partsList" class="space-y-4"></div>
    </div>
  </div>

  <script>
    const { createFFmpeg, fetchFile } = FFmpeg;
    const ffmpeg = createFFmpeg({ log: true });

    const videoInput = document.getElementById('videoInput');
    const statusContainer = document.getElementById('statusContainer');
    const statusText = document.getElementById('statusText');
    const statusPercent = document.getElementById('statusPercent');
    const progressBar = document.getElementById('progressBar');
    const resultsContainer = document.getElementById('resultsContainer');
    const partsList = document.getElementById('partsList');

    videoInput.addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if (!file) return;

      // Limpa resultados anteriores e ativa tela de progresso
      partsList.innerHTML = '';
      resultsContainer.classList.add('hidden');
      statusContainer.classList.remove('hidden');
      statusText.innerText = 'Carregando motor de vídeo (FFmpeg)...';
      progressBar.style.width = '0%';
      statusPercent.innerText = '0%';

      try {
        if (!ffmpeg.isLoaded()) {
          await ffmpeg.load();
        }

        // Atualiza a porcentagem durante a execução
        ffmpeg.setProgress(({ ratio }) => {
          const pct = Math.min(100, Math.max(0, Math.round(ratio * 100)));
          progressBar.style.width = pct + '%';
          statusPercent.innerText = pct + '%';
        });

        statusText.innerText = 'Carregando o vídeo na memória...';
        const ext = file.name.split('.').pop() || 'mp4';
        const inputName = `input.${ext}`;

        ffmpeg.FS('writeFile', inputName, await fetchFile(file));

        statusText.innerText = 'Fatiando vídeo em partes de 30 segundos...';

        // Comando FFmpeg:
        // -i: arquivo de entrada
        // -c copy: copia sem reprocessar áudio/vídeo (extremamente rápido)
        // -segment_time 30: fatia a cada 30s
        // -f segment: modo de segmentação
        await ffmpeg.run(
          '-i', inputName,
          '-c', 'copy',
          '-map', '0',
          '-segment_time', '30',
          '-f', 'segment',
          '-reset_timestamps', '1',
          'parte_%03d.mp4'
        );

        statusText.innerText = 'Gerando pré-visualizações...';

        // Lista arquivos gerados no sistema virtual
        const files = ffmpeg.FS('readdir', '/');
        const partFiles = files.filter(f => f.startsWith('parte_') && f.endsWith('.mp4')).sort();

        resultsContainer.classList.remove('hidden');

        partFiles.forEach((filename, index) => {
          const data = ffmpeg.FS('readFile', filename);
          const blob = new Blob([data.buffer], { type: 'video/mp4' });
          const videoUrl = URL.createObjectURL(blob);

          // Card para cada parte
          const card = document.createElement('div');
          card.className = 'flex flex-col sm:flex-row items-center justify-between bg-gray-50 p-4 rounded-xl border border-gray-200 gap-4';

          const infoDiv = document.createElement('div');
          infoDiv.className = 'w-full sm:w-auto text-center sm:text-left';
          infoDiv.innerHTML = `
            <div class="font-semibold text-gray-800">Parte ${index + 1}</div>
            <div class="text-xs text-gray-500">Duração: até 30s</div>
          `;

          const videoPreview = document.createElement('video');
          videoPreview.src = videoUrl;
          videoPreview.controls = true;
          videoPreview.className = 'w-full sm:w-44 h-28 object-cover rounded-lg bg-black';

          const actionsDiv = document.createElement('div');
          actionsDiv.className = 'flex gap-2 w-full sm:w-auto justify-center sm:justify-end';

          // Botão Download
          const downloadBtn = document.createElement('a');
          downloadBtn.href = videoUrl;
          downloadBtn.download = `whatsapp_status_parte_${index + 1}.mp4`;
          downloadBtn.className = 'px-3 py-2 bg-gray-200 hover:bg-gray-300 text-gray-700 text-sm font-medium rounded-lg transition flex items-center gap-1';
          downloadBtn.innerHTML = '⬇️ Baixar';

          // Botão Compartilhar direto no celular
          const shareBtn = document.createElement('button');
          shareBtn.className = 'px-3 py-2 bg-emerald-600 hover:bg-emerald-700 text-white text-sm font-medium rounded-lg transition flex items-center gap-1';
          shareBtn.innerHTML = '📲 Compartilhar';
          shareBtn.onclick = async () => {
            const shareFile = new File([blob], `status_parte_${index + 1}.mp4`, { type: 'video/mp4' });
            if (navigator.canShare && navigator.canShare({ files: [shareFile] })) {
              try {
                await navigator.share({
                  files: [shareFile],
                  title: `Status Parte ${index + 1}`,
                  text: `Parte ${index + 1} do meu vídeo!`
                });
              } catch (err) {
                console.log('Compartilhamento cancelado ou não suportado', err);
              }
            } else {
              alert('O compartilhamento direto não é suportado no seu navegador/computador. Use o botão "Baixar" e envie pelo WhatsApp.');
            }
          };

          actionsDiv.appendChild(downloadBtn);
          actionsDiv.appendChild(shareBtn);

          card.appendChild(infoDiv);
          card.appendChild(videoPreview);
          card.appendChild(actionsDiv);

          partsList.appendChild(card);
        });

        statusContainer.classList.add('hidden');

      } catch (err) {
        console.error(err);
        statusText.innerText = 'Ocorreu um erro ao cortar o vídeo.';
        alert('Erro ao processar o vídeo. Certifique-se de escolher um arquivo de vídeo válido.');
      }
    });
  </script>
</body>
</html>
